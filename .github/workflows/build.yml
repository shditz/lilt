name: Build Lilt

on:
  push:
    branches:
      - main
      - '26.*'
      - '1.21*'
    tags:
      - 'v*'
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build mod binary and run tests
        run: ./gradlew build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lilt-build-artifacts
          path: build/libs/lilt-*.jar

